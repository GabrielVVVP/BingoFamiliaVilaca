<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo da Família Vilaça - Jogo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body class="text-gray-800 min-h-screen flex flex-col items-center">

    <!-- Theme Toggle Button -->
    <button id="theme-toggle">🌙 Dark</button>

    <!-- Botão Voltar ao Lobby -->
    <button id="btn-back">← Voltar</button>

    <!-- CABEÇALHO E FOTO DA FAMÍLIA -->
    <header class="w-full max-w-5xl px-6 pt-10 pb-6 text-center">
        <h1 class="text-5xl md:text-6xl font-black drop-shadow-sm mb-4">
            Bingo da FV
        </h1>   
    </header>

    <!-- ÁREA PRINCIPAL -->
    <main class="w-full max-w-4xl px-4 flex flex-col items-center">
        
        <!-- Painel de Exibição -->
        <div id="display-panel" class="main-card display-card w-full rounded-[3rem] p-10 flex flex-col items-center justify-center relative">
            <div id="current-call" class="text-center">
                <span id="label-letter" class="text-4xl md:text-6xl font-bold block leading-none">AGUARDANDO</span>
                <span id="label-number" class="text-[4rem] md:text-[6rem] font-black leading-none number-display">SORTEIO!</span>
            </div>

            <!-- (Removido overlay de loading da IA) -->
        </div>

        <!-- CONFIGURAÇÕES E CONTROLES -->
        <div class="w-full mt-8 flex flex-col items-center gap-6">
            
            <!-- Botões Principais -->
            <div class="flex flex-col gap-4 max-w-md w-full">
                <button id="btn-draw" class="text-4xl font-bold py-6 rounded-2xl transition-transform active:scale-95 shadow-sm">
                    SORTEAR NÚMEROS
                </button>
                <button id="btn-repeat" class="text-2xl font-bold py-3 rounded-2xl transition-transform active:scale-95 mt-2 shadow-sm" disabled>
                    REPETIR SOM
                </button>
            </div>
        </div>

        <!-- HISTÓRICO -->
        <div class="w-full mt-10 mb-20">
            <div class="flex items-center justify-between mb-4">
                <h2 id="drawn-title" class="text-2xl font-bold text-accent border-b-2 pb-2">Números Sorteados:</h2>
                <label class="flex items-center gap-2 text-sm standalone-text">
                    <input id="sort-numeric" type="checkbox" class="form-checkbox h-4 w-4"> Ordenar numericamente
                </label>
            </div>
            <div id="history-list" class="flex flex-wrap gap-3">
                <!-- Injetado via JS -->
            </div>
            <div class="mt-6">
                <div class="flex items-center justify-between mb-2">
                    <h2 id="remaining-title" class="text-2xl font-bold text-accent border-b-2 pb-2">Números Remanescentes:</h2> 
                    <label class="flex items-center gap-2 text-sm standalone-text">
                        <input id="toggle-remaining" type="checkbox" class="form-checkbox h-4 w-4">
                        Mostrar
                    </label>
                </div>
                <div id="remaining-list" class="flex flex-wrap gap-2"></div>
                <div class="mt-4 flex justify-center">
                    <button id="btn-reset" class="bg-gray-400 hover:bg-gray-500 text-white text-xl py-3 px-6 rounded-xl transition-all">TEMOS UM VENCEDOR!</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- CONFIGURAÇÃO ---
        const apiKey = ""; // Chave do Gemini (vazia por padrão)
        const letters = ['B', 'I', 'N', 'G', 'O'];
        let pool = [];
        let drawn = [];

        // Modo especial (comemorativo)
        let specialMode = localStorage.getItem('specialMode') || 'none';
        let riggedSequence = [];
        let riggedIndex = 0;

        // Cartelas especiais (exemplo - ajustar conforme necessário)
        const card1 = [2,3,6,10,15,18,21,23,27,29,31,33,34,41,46,50,54,56,59,68,69,72,73,75];
        const card2 = [1,2,5,9,14,17,20,22,26,28,32,33,40,42,49,53,55,58,60,67,68,71,72,74];

        // Elementos DOM
        const lblLetter = document.getElementById('label-letter');
        const lblNumber = document.getElementById('label-number');
        const btnDraw = document.getElementById('btn-draw');
        const btnReset = document.getElementById('btn-reset');
        const btnRepeat = document.getElementById('btn-repeat');
        const btnBack = document.getElementById('btn-back');
        const historyList = document.getElementById('history-list');
        const drawnTitle = document.getElementById('drawn-title');
        const remainingTitle = document.getElementById('remaining-title');
        const sortNumeric = document.getElementById('sort-numeric');
        const remainingList = document.getElementById('remaining-list');
        const toggleRemaining = document.getElementById('toggle-remaining');

        // Pasta de voz selecionada (padrão = Danielle)
        let voiceFolder = localStorage.getItem('voiceFolder') || 'Danielle';
        let lastAudioId = null;
        let currentAudio = null;
        let isPlaying = false;

        function initPool() {
            pool = [];
            for (let i = 1; i <= 75; i++) {
                const letter = letters[Math.floor((i - 1) / 15)];
                pool.push({ l: letter, n: i, id: `${letter}${i}` });
            }

            // Se modo especial ativo, preparar sequência rigged
            if (specialMode !== 'none') {
                prepareRiggedSequence();
            }
        }

        function prepareRiggedSequence() {
            let targetCard = specialMode === 'card1' ? card1 : card2;
            let sequence = [...targetCard];

            // Adicionar 6 números aleatórios não presentes na cartela
            let availableNumbers = [];
            for (let i = 1; i <= 75; i++) {
                if (!targetCard.includes(i)) {
                    availableNumbers.push(i);
                }
            }

            // Selecionar 25 números aleatórios dos disponíveis
            for (let i = 0; i < 25; i++) {
                let randomIndex = Math.floor(Math.random() * availableNumbers.length);
                sequence.push(availableNumbers.splice(randomIndex, 1)[0]);
            }

            // Embaralhar a sequência para não ser óbvio
            riggedSequence = sequence.sort(() => Math.random() - 0.5);
            riggedIndex = 0;
        }

        // --- SISTEMA DE ÁUDIO ---

        // 1. Áudio Local (Seus WAVs)
        function playLocalAudio(id, silvioMode = null) {
            // Não inicia novo áudio enquanto outro estiver tocando
            if (isPlaying) return;
            const folderPath = voiceFolder ? `audio/${voiceFolder}/` : 'audio/';
            const path = `${folderPath}${id}.wav`;
            if (silvioMode) {
                path = `${folderPath}${silvioMode}.wav`;
            }
            const audio = new Audio(path);
            currentAudio = audio;
            isPlaying = true;
            // trava botões enquanto toca
            if (btnDraw) btnDraw.disabled = true;
            if (btnRepeat) btnRepeat.disabled = true;

            audio.preload = 'auto';
            audio.play().then(() => {
                // registra o último áudio reproduzido (repetir será habilitado ao finalizar)
                lastAudioId = id;
            }).catch(err => {
                console.warn(`Falha ao reproduzir ${path}:`, err);
                // se falhar em iniciar, libera controles
                isPlaying = false;
                currentAudio = null;
                if (btnDraw) btnDraw.disabled = false;
                if (btnRepeat) btnRepeat.disabled = !lastAudioId;
            });

            audio.addEventListener('ended', () => {
                isPlaying = false;
                currentAudio = null;
                if (btnDraw) btnDraw.disabled = false;
                if (btnRepeat) btnRepeat.disabled = !lastAudioId;
            });

            audio.addEventListener('error', () => {
                // em caso de erro durante a reprodução, garante que liberamos o travamento
                isPlaying = false;
                currentAudio = null;
                if (btnDraw) btnDraw.disabled = false;
                if (btnRepeat) btnRepeat.disabled = !lastAudioId;
            });
        }

        // 2. Áudio Gemini IA (Opcional)
        async function playAiAudio(letter, number) {
            if (!apiKey) {
                console.error("API Key do Gemini não configurada.");
                playLocalAudio(`${letter}${number}`);
                return;
            }

            const prompt = `Diga de forma alegre e carinhosa para uma família reunida: Letra ${letter}, número ${number}!`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: {
                                voiceConfig: {
                                    prebuiltVoiceConfig: { voiceName: "Aoede" } // Voz calorosa
                                }
                            }
                        }
                    })
                });

                const data = await response.json();
                const base64 = data.candidates[0].content.parts[0].inlineData.data;
                decodeAndPlay(base64);
            } catch (err) {
                console.error("Erro na IA, voltando para local:", err);
                playLocalAudio(`${letter}${number}`);
            }
        }

        // Auxiliar para tocar PCM do Gemini
        function decodeAndPlay(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            
            // Header WAV básico (24kHz Mono)
            const wavHeader = new ArrayBuffer(44);
            const view = new DataView(wavHeader);
            const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
            writeStr(0, 'RIFF'); view.setUint32(4, 36 + bytes.length, true);
            writeStr(8, 'WAVE'); writeStr(12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, 24000, true); view.setUint32(28, 48000, true);
            view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            writeStr(36, 'data'); view.setUint32(40, bytes.length, true);

            const blob = new Blob([wavHeader, bytes], { type: 'audio/wav' });
            new Audio(URL.createObjectURL(blob)).play();
        }

        // --- LÓGICA DO JOGO ---

        function draw() {
            if (isPlaying) return; // evita sortear enquanto áudio anterior toca

            if (pool.length === 0) {
                lblLetter.textContent = "FIM DE";
                lblNumber.textContent = "JOGO!";
                btnDraw.disabled = true;
                return;
            }

            let picked;
            if (specialMode !== 'none' && riggedIndex < riggedSequence.length) {
                // Modo especial: usar sequência pré-definida
                const targetNumber = riggedSequence[riggedIndex++];
                picked = pool.find(item => item.n === targetNumber);
                if (picked) {
                    pool.splice(pool.indexOf(picked), 1);
                } else {
                    // Fallback se o número já foi sorteado (não deveria acontecer)
                    const idx = Math.floor(Math.random() * pool.length);
                    picked = pool.splice(idx, 1)[0];
                }
            } else {
                // Modo normal: aleatório
                const idx = Math.floor(Math.random() * pool.length);
                picked = pool.splice(idx, 1)[0];
            }

            drawn.push(picked);

            // Atualiza UI
            lblLetter.textContent = picked.l;
            lblNumber.textContent = picked.n;

            // Usa áudio local (Gemini não está selecionável)
            playLocalAudio(picked.id);

            updateHistory();
            updateRemaining();
        }

        function updateHistory() {
            const items = drawn.slice();
            let listOrder = [];
            if (sortNumeric && sortNumeric.checked) {
                items.sort((a, b) => a.n - b.n);
                listOrder = items;
            } else {
                listOrder = items.slice().reverse();
            }

            historyList.innerHTML = listOrder.map(item => `
                <div class="history-item px-4 py-2 rounded-xl shadow-sm text-lg font-bold">
                    <span style="color:#071029; margin-right:.4rem">${item.l}</span>${item.n}
                </div>
            `).join('');
            drawnTitle.textContent = `Números Sorteados: ${drawn.length}`;
            remainingTitle.textContent = `Números Remanescentes: ${75 - drawn.length}`;
        }

        function updateRemaining() {
            const drawnSet = new Set(drawn.map(d => d.n));
            const remaining = [];
            for (let i = 1; i <= 75; i++) {
                if (!drawnSet.has(i)) remaining.push(i);
            }

            // Render com prefixo de letra (ex: B1, I27)
            remainingList.innerHTML = remaining.map(n => {
                const letter = letters[Math.floor((n - 1) / 15)];
                return `
                <div class="px-3 py-2 rounded-xl font-bold" style="background:#ffffff; color:#071029; border:1px solid rgba(7,16,41,0.04); box-shadow:0 2px 8px rgba(0,0,0,0.04)">${letter}${n}</div>
            `;
            }).join('');
        }

        btnDraw.addEventListener('click', draw);
        if (btnRepeat) {
            // botão de repetir som: toca o último áudio conhecido
            btnRepeat.addEventListener('click', () => {
                if (isPlaying) return; // bloqueia enquanto reproduz
                if (lastAudioId) {
                    playLocalAudio(lastAudioId);
                } else {
                    alert('Nenhum áudio disponível para repetir.');
                }
            });
            // desabilita por padrão até que um áudio seja tocado
            btnRepeat.disabled = true;
        }
        btnReset.addEventListener('click', () => {
            if(confirm("Temos um novo vencedor no Bingo da Família Vilaça? (Reiniciar partida)")) {
                playLocalAudio(silvioMode = `parabens`);
                    let params = {
                    particleCount: 500, // Quantidade de confetes
                    spread: 90, // O quanto eles se espalham
                    startVelocity: 70, // Velocidade inicial
                    origin: { x: 0, y: 0.5 }, // Posição inicial na tela
                    angle: 45 // Ângulo em que os confetes serão lançados
                };

                // Joga confetes da esquerda pra direita
                confetti(params);
                initPool();
                drawn = [];
                riggedIndex = 0; // Reinicializar índice da sequência rigged
                lblLetter.textContent = "PRONTOS?";
                lblNumber.textContent = "VAMOS MAIS UMA!";
                historyList.innerHTML = "";
                // para segurança, interrompe qualquer áudio em reprodução
                //if (currentAudio) {
                //    try { currentAudio.pause(); currentAudio.currentTime = 0; } catch (e) {}
                //    currentAudio = null;
                //}
                //isPlaying = false;
                btnDraw.disabled = false;
                if (btnRepeat) {
                    btnRepeat.disabled = true;
                }
                lastAudioId = null;
                updateHistory();
                updateRemaining();
            }
        });

        // --- Botão Voltar ao Lobby ---
        btnBack.addEventListener('click', () => {
            if (drawn.length > 0 && confirm("Você tem um jogo em progresso. Deseja voltar ao lobby?")) {
                window.location.href = 'lobby.html';
            } else if (drawn.length === 0) {
                window.location.href = 'lobby.html';
            }
        });

        // --- Seletor de voz gravada ---
        function setVoiceFolder(folder) {
            voiceFolder = folder || 'Danielle';
            localStorage.setItem('voiceFolder', voiceFolder);
        }

        // Inicializa com configuração do localStorage
        setVoiceFolder(voiceFolder);

        // Atualiza histórico imediatamente ao mudar o checkbox de ordenação
        if (sortNumeric) {
            sortNumeric.addEventListener('change', () => updateHistory());
        }

        // Toggle para mostrar/ocultar apenas a lista de remanescentes
        if (toggleRemaining && remainingList) {
            toggleRemaining.addEventListener('change', () => {
                remainingList.style.display = toggleRemaining.checked ? '' : 'none';
            });
            // estado inicial: toggle padrão OFF -> esconder lista
            remainingList.style.display = toggleRemaining.checked ? '' : 'none';
        }

        initPool();
        // Inicializa histórico e remanescentes
        updateHistory();
        updateRemaining();

        // --- Theme Toggle ---
        const themeToggle = document.getElementById('theme-toggle');
        const savedTheme = localStorage.getItem('theme') || 'light';
        
        if (savedTheme === 'light') {
            document.body.classList.add('light-theme');
            themeToggle.textContent = '☀️ Light';
        } else {
            themeToggle.textContent = '🌙 Dark';
        }

        themeToggle.addEventListener('click', () => {
            const isLight = document.body.classList.toggle('light-theme');
            const newTheme = isLight ? 'light' : 'dark';
            localStorage.setItem('theme', newTheme);
            themeToggle.textContent = isLight ? '☀️ Light' : '🌙 Dark';
        });
    </script>
</body>
</html>
